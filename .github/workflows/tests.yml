name: Unit tests

on:
  push:
    branches:
      - main
      - "*-release"
  pull_request:
    branches:
      - main
      - "*-release"
  workflow_dispatch:

env:
  TRANSFORMERS_IS_CI: 1
  HF_HUB_DISABLE_PROGRESS_BARS: 1  # The Transformers v5 weight loading progress bars heavily expand the logs
  HF_TOKEN: ${{ secrets.HF_TOKEN }}  # Read token to avoid rate limits / gated-repo failures when downloading from the Hub

permissions: {}

jobs:
  test_sampling:
    permissions:
      contents: read
    name: Run unit tests
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Remove unnecessary files
        run: |
          df -h /
          # Remove software and language runtimes we're not using
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h /
        if: runner.os == 'Linux'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      # pyctcdecode pins numpy<2, but pyarrow>=26 requires numpy>=2 at runtime.
      # Python 3.13 and 3.14 also need exclusions for kenlm and the librosa dependency chain.
      - name: Create excludes file for incompatible audio dependencies
        shell: bash
        run: |
          echo "pyctcdecode" > excludes.txt
          if [[ "${{ matrix.python-version }}" == "3.13" || "${{ matrix.python-version }}" == "3.14" ]]; then
            echo -e "kenlm\nlibrosa\nnumba\nllvmlite" >> excludes.txt
          fi
      - name: Install dependencies
        run: uv pip install '.[train,merge]' --group test --excludes excludes.txt --system

      - name: Install model2vec
        run: uv pip install model2vec --system

      - name: Run unit tests
        run: |
          python -m pytest --durations 20 -sv tests/
